name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java Sources
      run: |
        mkdir -p bin
        javac -d bin $(find src -name "*.java" ! -path "*/test/*")

    - name: Verify Test Files
      run: |
        javac -cp bin -d bin $(find src -name "*Test.java")